name: CatFight
version: '${version}'
main: cn.moze.catfight.bukkit.CatFightPlugin
api-version: '1.18'
author: moze
description: Cat threat, tussle and paper-cat behavior for Bukkit/Paper 1.18.2-1.21.1
commands:
  catfight:
    description: CatFight administration
    usage: /catfight <reload|pack|cleanup>
    permission: catfight.admin
permissions:
  catfight.admin:
    description: Allows CatFight administration commands
    default: op
