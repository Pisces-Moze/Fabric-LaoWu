pairing:
  range: 16.0
  threat-seconds: 8.0
  tussle-seconds: 5.0
  cooldown-seconds: 12.0
  separation: 1.8

paper-cat:
  restore-clicks: 3
  seek-rails: true
  rail-range: 10

resource-pack:
  enabled: true
  # Failed downloads fall back to visible vanilla cats by default instead of disconnecting players.
  kick-on-failure: false
  # Public address players can reach. Example: http://play.example.com:8123/catfight-pack.zip
  public-url: ''
  bind-address: '0.0.0.0'
  port: 8123

visuals:
  use-resource-models: true
  particles: true
